server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # PWA manifest needs the correct MIME type.
    location ~* \.webmanifest$ { default_type application/manifest+json; }

    # Never cache the service worker or shell so updates roll out immediately.
    location = /sw.js      { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Static assets can be cached by the browser (the SW manages offline copies).
    location ~* \.(js|css|json|svg|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback for clean-URL (History API) deep links: serve the app shell
    # for any path that isn't a real file, and let the client-side router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
