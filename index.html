<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Clean-URL routing support (must run before any relative asset loads). -->
  <base href="./" />
  <script>
    // Point <base> at the app root so relative assets (css/js/icons) resolve
    // correctly even on a deep-link reload like /Kinetos/plan/123, whether the
    // app is served at the domain root or a /repo/ subpath. Base is detected by
    // finding the first path segment that is a known in-app route — everything
    // before it is the base. No hardcoded sub-path depth, so root and subpath
    // deploys both work. (Keep TOP_ROUTES in sync with 404.html; and don't name
    // the repo after a route.)
    var TOP_ROUTES = ['exercises', 'plan', 'templates', 'progress', 'profile', 'session'];
    (function () {
      var segs = location.pathname.split('/');
      var idx = segs.length;
      for (var i = 0; i < segs.length; i++) { if (TOP_ROUTES.indexOf(segs[i]) >= 0) { idx = i; break; } }
      var base = (idx < segs.length) ? segs.slice(0, idx).join('/') + '/' : location.pathname;
      document.querySelector('base').setAttribute('href', base || '/');
    })();
    // Restore a deep link handed over by 404.html (path arrives as "?/plan/1").
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        history.replaceState(null, '', l.pathname.replace(/\/$/, '') + decoded + l.hash);
      }
    })(location);
  </script>

  <!-- No maximum-scale/user-scalable: blocking pinch-zoom fails WCAG 1.4.4. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Kinetos — plan and track your gym workouts. Offline-first PWA." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kinetos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="backBtn" class="topbar__back" aria-label="Back" data-i18n-aria="common.back" hidden><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <h1 id="topbarTitle" class="topbar__title">Kinetos</h1>
      <div class="topbar__actions" id="topbarActions"></div>
    </header>

    <main id="view" class="view" role="main"></main>

    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <a class="tabbar__brand" href="." data-route="/" aria-label="Kinetos home">
        <img src="assets/icons/icon.svg" alt="" />
        <span>Kinetos</span>
      </a>
      <a class="tabbar__item" href="." data-route="/" data-tab="home">
        <span class="tabbar__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
        <span class="tabbar__label" data-i18n="nav.home">Home</span>
      </a>
      <a class="tabbar__item" href="exercises" data-route="/exercises" data-tab="exercises">
        <span class="tabbar__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 9v6"/><path d="M7 7v10"/><path d="M17 7v10"/><path d="M20 9v6"/><path d="M7 12h10"/></svg></span>
        <span class="tabbar__label" data-i18n="nav.exercises">Exercises</span>
      </a>
      <a class="tabbar__item" href="plan" data-route="/plan" data-tab="plan">
        <span class="tabbar__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>
        <span class="tabbar__label" data-i18n="nav.calendar">Calendar</span>
      </a>
      <a class="tabbar__item" href="progress" data-route="/progress" data-tab="progress">
        <span class="tabbar__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
        <span class="tabbar__label" data-i18n="nav.progress">Progress</span>
      </a>
      <a class="tabbar__item" href="profile" data-route="/profile" data-tab="profile">
        <span class="tabbar__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span class="tabbar__label" data-i18n="nav.profile">Profile</span>
      </a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
