# Serve Kinetos as static files with nginx. `run.bat` calls `docker compose up`.
services:
  kinetos:
    image: nginx:alpine
    container_name: kinetos
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
